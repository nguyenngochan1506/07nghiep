worker_processes auto;
pid /tmp/nginx.pid;

events {
  worker_connections 1024;
}

http {
  include /etc/nginx/mime.types;
  default_type application/octet-stream;

  access_log /dev/stdout;
  error_log /dev/stderr warn;

  sendfile on;
  keepalive_timeout 65;

  client_body_temp_path /tmp/client_temp;
  proxy_temp_path /tmp/proxy_temp;
  fastcgi_temp_path /tmp/fastcgi_temp;
  uwsgi_temp_path /tmp/uwsgi_temp;
  scgi_temp_path /tmp/scgi_temp;

  server {
    listen 3001;
    server_name admin.07nghiep.site;
    root /usr/share/nginx/html/admin;
    index index.html;

    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600";
    }
  }

  server {
    listen 3002;
    server_name employer.07nghiep.site;
    root /usr/share/nginx/html/employer;
    index index.html;

    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600";
    }
  }

  server {
    listen 3003;
    server_name 07nghiep.site www.07nghiep.site;
    root /usr/share/nginx/html/candidate;
    index index.html;

    if ($host = www.07nghiep.site) {
      return 301 https://07nghiep.site$request_uri;
    }

    location /assets/ {
      try_files $uri =404;
      add_header Cache-Control "public, max-age=31536000, immutable";
    }

    location / {
      try_files $uri $uri/ /index.html;
      add_header Cache-Control "public, max-age=300, stale-while-revalidate=3600";
    }
  }
}
